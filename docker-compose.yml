services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dockertaskapp-web
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://appuser:apppassword@db:5432/taskdb
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    container_name: dockertaskapp-db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: taskdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d taskdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: